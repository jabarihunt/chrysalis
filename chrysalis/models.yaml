# Model classes for Chrysalis agents.
#
# Each agent file names one class in its model_class field. Phase 4's
# generator writes each class's model into that tool's agent files.
#
# Factory ADR 0027: within one tool, each gate's class uses a different model
# family from every class whose work that gate reviews.
# - review runs the security gate, the RED review, and the code review gate,
#   which review build, test, and plan work, so it differs from all three.
# - test runs the test gate, which reviews build work, so it differs from build
#   and review.
# - plan may share a family with build or test, never with review.
# A tool marked single_family: true offers only one family, so those classes
# use different models instead, and a fallback must also differ from every
# model its class must differ from. bun test chrysalis/scripts checks these
# rules.
#
# confirmed: true means the ID was checked against the tool's own model list.
# confirmed: false means the ID comes from the tool's docs and still needs a
# check. The generator refuses to write an unconfirmed ID. When a model isn't
# available on the human's plan, the generator uses its fallback.

classes:
  plan:
    use: Judgment and prose. The TPM, spec writer, documentation agent, and factory-maintainer.
  build:
    use: Writing product code. The database, backend, and frontend agents.
  test:
    use: Writing acceptance tests and running the test gate. A different family from build.
  review:
    use: The security gate, the RED review, and the code review gate. A different family from build and test.

tools:
  cursor:
    source: https://cursor.com/docs/models
    check: Open the model picker in Cursor, or run cursor-agent --list-models, and compare the IDs.
    note: Grok draws on the Cursor Models pool, which has more included usage. Claude and GPT draw on the Other Models pool at API prices.
    plan:
      family: claude
      model: claude-opus-5-5
      confirmed: false
    build:
      family: grok
      model: grok-4.7
      confirmed: false
    test:
      family: claude
      model: claude-opus-5-5
      confirmed: false
    review:
      family: gpt
      model: gpt-5.6-sol
      confirmed: false

  kilo:
    source: https://api.kilo.ai/api/gateway/models
    check: Run kilo models, and confirm the provider prefix Kilo agent files need when they use the Kilo Gateway.
    note: These IDs match Kilo Gateway's public model catalog as of 2026-10-11.
    plan:
      family: claude
      model: anthropic/claude-opus-5.5
      confirmed: false
    build:
      family: grok
      model: x-ai/grok-4.7
      confirmed: false
    test:
      family: claude
      model: anthropic/claude-opus-5.5
      confirmed: false
    review:
      family: gpt
      model: openai/gpt-5.6-sol
      confirmed: false

  kiro:
    source: https://kiro.dev/docs/models/available-models.md
    check: Run /model in Kiro, and compare the IDs.
    note: >-
      Kiro has no Grok or Gemini models, so build uses an open-weight family.
      Claude Opus 5.5 and GPT-5.6 are experimental in Kiro and need the Pro
      plan or above. Credit multipliers are 2.0x for Opus 5.5, 4.4x for
      GPT-5.6 Sol, and 0.5x for GLM-5.
    plan:
      family: claude
      model: claude-opus-5.5
      confirmed: false
    build:
      family: glm
      model: glm-5
      confirmed: false
    test:
      family: claude
      model: claude-opus-5.5
      confirmed: false
    review:
      family: gpt
      model: gpt-5.6-sol
      confirmed: false

  claude:
    source: https://code.claude.com/docs/en/sub-agents
    check: Run /model in Claude Code, and compare the IDs.
    single_family: true
    note: >-
      Claude Code runs only Claude models. A subagent's model field takes an
      alias such as opus, sonnet, or fable, or a full ID such as
      claude-opus-5-5. Full IDs pin the version, so the generator writes full
      IDs where they're known. Fable needs a plan that includes it.
    plan:
      family: claude
      model: claude-opus-5-5
      confirmed: false
    build:
      family: claude
      model: claude-sonnet-5-5
      confirmed: false
    test:
      family: claude
      model: claude-opus-5
      confirmed: false
    review:
      family: claude
      model: fable
      fallback: claude-opus-4-8
      confirmed: false
